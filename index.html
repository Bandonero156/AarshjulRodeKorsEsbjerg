<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Årshjul 2027 – Røde Kors Esbjerg</title>
  <link rel="stylesheet" href="style.css?v=b1b8d004" />
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">RØDE KORS · ESBJERG</p>
        <h1 id="pageHeading">Årshjul 2027</h1>
        <p class="intro">Klik på en måned for at se aktiviteter. Vælg en kategori for at filtrere.</p>
        <div class="year-control">
          <label for="yearSelect">Vælg år</label>
          <select id="yearSelect" aria-label="Vælg år" disabled>
            <option value="2027">2027</option>
          </select>
        </div>
      </div>

      <div class="legend" role="group" aria-label="Filtrér kategori">
        <button type="button" data-category="all" class="active" aria-pressed="true">Alle</button>
        <button type="button" data-category="meeting" aria-pressed="false"><i class="dot meeting" aria-hidden="true"></i>Mødeaften</button>
        <button type="button" data-category="committee" aria-pressed="false"><i class="dot committee" aria-hidden="true"></i>Udvalg</button>
        <button type="button" data-category="hr" aria-pressed="false"><i class="dot hr" aria-hidden="true"></i>HR-udvalg</button>
        <button type="button" data-category="duty" aria-pressed="false"><i class="dot duty" aria-hidden="true"></i>Vagt</button>
        <button type="button" data-category="education" aria-pressed="false"><i class="dot education" aria-hidden="true"></i>Uddannelse</button>
        <button type="button" data-category="social" aria-pressed="false"><i class="dot social" aria-hidden="true"></i>Socialt</button>
      </div>
    </header>

    <section class="dashboard">
      <div class="wheel-wrap">
        <div id="wheel" class="wheel">
          <div class="wheel-center">
            <strong id="wheelYear">2027</strong>
            <span>Røde Kors</span>
          </div>
        </div>
        <div id="monthList" class="month-list" aria-label="Måneder"></div>
      </div>

      <aside class="details-card">
        <div class="details-heading">
          <div>
            <p class="eyebrow">VALGT MÅNED</p>
            <h2 id="monthTitle">Januar</h2>
          </div>
          <span id="eventCount" class="count-badge"></span>
        </div>
        <div id="eventList" class="event-list"></div>
      </aside>
    </section>
  </main>

  <script src="script.js?v=9889dbb1"></script>
</body>
</html>
